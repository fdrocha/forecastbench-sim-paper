{
  "schema_version": "1",
  "format_note": "JSON is valid YAML 1.2",
  "default": "smoke",
  "environment": "README.md and docs/ENVIRONMENT.md",
  "workflows": [
    {
      "id": "smoke",
      "command": "python -m fbsim_paper smoke",
      "inputs": "synthetic fixture/imports only",
      "outputs": "stdout JSON",
      "schema_version": "1",
      "access": "public synthetic inputs",
      "runtime": "under 5 seconds expected",
      "cost_usd": 0,
      "network": false,
      "side_effects": "none beyond Python import caches",
      "production": false
    },
    {
      "id": "tests",
      "command": "python -m pytest -q tests",
      "inputs": "synthetic test fixtures",
      "outputs": "test log",
      "schema_version": "1",
      "access": "public synthetic inputs",
      "runtime": "under 10 seconds expected",
      "cost_usd": 0,
      "network": false,
      "side_effects": "temporary test directories",
      "production": false
    },
    {
      "id": "check-data",
      "command": "python -m fbsim_paper check-data --data-root \"$FBSIM_DATA_ROOT\" [--write]",
      "inputs": "the data folder and its SHA256SUMS.txt; the installed benchmark scorers",
      "outputs": "stdout JSON (missing, changed and added files; scorers differing from the pin); nonzero exit on any",
      "schema_version": "1",
      "access": "public code; the data folder required",
      "runtime": "about a minute; scales with input bytes",
      "cost_usd": 0,
      "network": false,
      "side_effects": "none; --write rewrites SHA256SUMS.txt",
      "production": false
    },
    {
      "id": "build",
      "command": "fbsim-paper build [micropolis] [freeciv] [starsim] [combined] [case-study]",
      "inputs": "$FBSIM_DATA_ROOT (datasets/paper-inputs and the world folders), this checkout's scripts",
      "outputs": "generated tables, figures, macros and data files in the manuscript checkout ($FBSIM_PAPER_ROOT)",
      "schema_version": "1",
      "access": "public code; the data folder required",
      "runtime": "about 7 minutes for all steps; no engine runs",
      "cost_usd": 0,
      "network": false,
      "side_effects": "overwrites generated files in the manuscript checkout (refused if it has uncommitted changes there, unless --allow-dirty); review with git there",
      "production": false
    },
    {
      "id": "case-study",
      "command": "fbsim-paper case-study --data-root \"$FBSIM_DATA_ROOT\" --output \"$NEW_CALIBRATION_OUTPUT\" [--freeciv-root DIR] [--measles-root DIR] [--measles-roster FILE] [--parser-audit]",
      "inputs": "FreeCiv forecasts/replays, historical measles scores/series and model roster; with --parser-audit, the FreeCiv and measles raw replies",
      "outputs": "diagnostics, source hashes, bootstrap/sensitivity tables and the manuscript two-bar figure",
      "access": "public code; the data folder required",
      "network": false,
      "production": false,
      "cost_usd": 0,
      "side_effects": "Creates a new output directory only; no data or manuscript changes"
    },
    {
      "id": "supplement",
      "command": "fbsim-paper supplement [--anonymization DIR] [--out NEW_DIR]",
      "inputs": "$FBSIM_DATA_ROOT, the anonymization folder (default private-data/datasets/supplement-anonymization beside it) and the committed manuscript checkout ($FBSIM_PAPER_ROOT)",
      "outputs": "anonymized reviewer supplement folder and zip beside the archive",
      "access": "private anonymization rules; output is for OpenReview upload by the authors",
      "network": false,
      "production": false,
      "cost_usd": 0,
      "side_effects": "Creates a new folder and zip only; never overwrites"
    },
    {
      "id": "compare",
      "command": "fbsim-paper compare EXPECTED_PAPER REBUILT_PAPER",
      "inputs": "two paper folders (data/ and figures/)",
      "outputs": "stdout JSON; nonzero exit on differences",
      "access": "public code",
      "network": false,
      "production": false,
      "cost_usd": 0,
      "side_effects": "none"
    }
  ],
  "production_replay": "not exposed; separate explicit authorization, engine dependencies and production configs required"
}
